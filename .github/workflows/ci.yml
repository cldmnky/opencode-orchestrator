name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test:unit

      - name: Check source tree after unit tests
        run: test -z "$(git status --short --untracked-files=all)"

      - name: Contract tests
        run: bun run test:contract

      - name: Build distribution
        run: bun run build

      - name: Package smoke test
        run: bun run scripts/package-smoke.ts

      - name: Check source tree after verification
        run: test -z "$(git status --short --untracked-files=all)"
